<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JonatanDev · En construcción</title>
<meta name="description" content="La página de servicios de JonatanDev está en construcción. Mientras tanto, puedes contactarme por correo o WhatsApp.">
<meta name="robots" content="noindex">
<link rel="icon" href="iconos/icono_es.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --accent: #0b5ed7; --accent-dark: #0846a3; --bg: #fff; --bg-2: #f4f6f8; --ink: #0f1720; --ink-2: #4a5562; --rule: #e3e7ec;
  --wa: #1fa855; --wa-dark: #15803d; --ease: cubic-bezier(.34,1.56,.64,1);
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg-2); color: var(--ink); font: 500 17px/1.6 "Manrope", system-ui, sans-serif; -webkit-font-smoothing: antialiased; display: flex; flex-direction: column; }
header { padding: 20px 24px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.langs { display: flex; gap: 4px; background: #fff; border: 2px solid var(--rule); border-radius: 12px; padding: 3px; }
.langs button { font: inherit; font-weight: 800; font-size: .85rem; border: 0; background: none; color: var(--ink-2); padding: 6px 10px; border-radius: 8px; cursor: pointer; }
.langs button[aria-pressed="true"] { background: var(--accent); color: #fff; }
.logo { display: inline-flex; align-items: center; gap: 10px; font-weight: 800; font-size: 1.15rem; text-decoration: none; color: var(--ink); letter-spacing: -0.02em; }
.logo i { width: 32px; height: 32px; border-radius: 8px; background: var(--ink); color: #fff; display: grid; place-items: center; font-style: normal; font-size: 0.95rem; }
.logo b { font-weight: 800; } .logo span { color: var(--accent); }
main { flex: 1; display: grid; place-items: center; padding: 24px 16px 56px; }
.card { width: 100%; max-width: 620px; background: #fff; border: 2px solid var(--rule); border-radius: 24px; box-shadow: 0 6px 0 var(--rule); padding: 40px 32px; text-align: center; }
.buddy-row { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 26px; }
.buddy { width: 110px; height: 121px; flex: none; }
.buddy svg { width: 100%; height: 100%; overflow: visible; }
.buddy .eyes { animation: blink 4.2s infinite; transform-origin: 50% 46px; transform-box: view-box; }
.buddy .arm-type-l { animation: type .32s ease-in-out infinite alternate; }
.buddy .arm-type-r { animation: type .32s .16s ease-in-out infinite alternate; }
.bubble { position: relative; background: #fff; font-weight: 800; padding: 10px 14px; border-radius: 16px; border: 2px solid var(--rule); box-shadow: 0 4px 0 var(--rule); font-size: .95rem; white-space: nowrap; animation: boing 700ms 300ms var(--ease) both; }
.bubble::before { content: ""; position: absolute; left: -10px; top: 50%; margin-top: -8px; border: 8px solid transparent; border-left: 0; border-right-color: var(--rule); }
.dots i { display: inline-block; animation: dot 1.2s infinite; font-style: normal; }
.dots i:nth-child(2) { animation-delay: .2s; } .dots i:nth-child(3) { animation-delay: .4s; }
.tag { display: inline-block; background: #fff4d6; color: #8a5a00; font-weight: 800; font-size: .8rem; letter-spacing: .08em; text-transform: uppercase; padding: 6px 14px; border-radius: 999px; margin-bottom: 16px; }
h1 { margin: 0; font-size: clamp(1.8rem, 3vw + .9rem, 2.5rem); line-height: 1.15; letter-spacing: -0.02em; font-weight: 800; text-wrap: balance; }
p { margin: 14px auto 0; color: var(--ink-2); max-width: 46ch; }
.bar { display: none; height: 14px; background: var(--bg-2); border-radius: 999px; margin: 28px auto 0; max-width: 360px; overflow: hidden; border: 2px solid var(--rule); }
.bar span { display: block; height: 100%; width: 70%; background: var(--accent); border-radius: 999px; animation: fill 1.6s var(--ease) both; }
.actions { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-top: 30px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; padding: 14px 22px; border-radius: 12px; font-weight: 800; font-size: 1rem; text-decoration: none; transition: transform 100ms, box-shadow 100ms; }
.btn:active { transform: translateY(5px); box-shadow: none !important; }
.btn-wa { background: var(--wa); color: #fff; box-shadow: 0 5px 0 var(--wa-dark); }
.btn-mail { background: #fff; color: var(--ink); border: 2px solid var(--rule); box-shadow: 0 5px 0 var(--rule); }
.btn svg { width: 22px; height: 22px; flex: none; }
.btn span { display: grid; text-align: left; line-height: 1.25; }
.btn small { font-size: .74rem; font-weight: 700; opacity: .8; text-transform: uppercase; letter-spacing: .06em; }
.btn-mail small { color: var(--ink-2); }
p strong { color: var(--ink); }
.back { display: inline-block; margin-top: 26px; color: var(--accent); font-weight: 700; text-decoration: none; }
.back:hover { text-decoration: underline; }
@keyframes blink { 0%, 94%, 100% { transform: scaleY(1); } 97% { transform: scaleY(.1); } }
@keyframes type { to { transform: translateY(-3px); } }
@keyframes boing { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
@keyframes dot { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-4px); } }
@keyframes fill { from { width: 0; } }
@media (max-width: 520px) {
  .card { padding: 32px 20px; }
  .buddy { width: 84px; height: 92px; }
  .bubble { font-size: .88rem; }
  .btn { width: 100%; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
<!-- Contador de visitas (GoatCounter: https://bibliacba.goatcounter.com) -->
<script data-goatcounter="https://bibliacba.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</head>
<body>
<header><a class="logo" href="index.html" data-home><i>J</i><b>Jonatan<span>Dev</span></b></a><div class="langs" role="group" aria-label="Idioma"><button type="button" data-lang="es">ES</button><button type="button" data-lang="pt">PT</button><button type="button" data-lang="en">EN</button></div></header>
<main>
  <div class="card">
    <div class="buddy-row" aria-hidden="true"><div class="buddy" data-buddy="laptop"></div><div class="bubble"><span data-t="bubble">Programando</span><span class="dots"><i>.</i><i>.</i><i>.</i></span></div></div>
    <span class="tag" data-t="tag">En construcción</span>
    <h1 data-t="h1">Estoy preparando esta página.</h1>
    <p data-t="p">Esta página está en construcción. Mientras tanto, puedes contactarme por <strong>correo</strong> o por <strong>WhatsApp</strong> y con gusto conversamos sobre tu proyecto.</p>
    <div class="bar" role="progressbar" aria-label="Progreso de la página" aria-valuenow="70" aria-valuemin="0" aria-valuemax="100"><span></span></div>
    <div class="actions">
      <a class="btn btn-wa" data-wa href="https://wa.me/5493874523935?text=Hola%20Jonatan%2C%20quiero%20consultarte%20por%20un%20proyecto" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.3 14.1c-.2.6-1.3 1.2-1.8 1.3-.5 0-1 .2-3.3-.7-2.8-1.1-4.5-4-4.7-4.2-.1-.2-1.1-1.5-1.1-2.9s.7-2 1-2.3c.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.9 2.1c.1.2.1.4 0 .5l-.3.5-.4.5c-.1.1-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.1 1 2.1 1.3 2.4 1.5.3.1.5.1.6-.1l.9-1.1c.2-.3.4-.2.7-.1l2 1c.3.1.5.2.5.3.1.2.1.7-.1 1.3z"/></svg><span><small>WhatsApp</small>+54 9 387 452-3935</span></a>
      <a class="btn btn-mail" data-mail href="mailto:adventistgo@gmail.com?subject=Consulta%20por%20un%20proyecto"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg><span><small data-t="mail">Correo</small>adventistgo@gmail.com</span></a>
    </div>
    <a class="back" href="index.html" data-home data-t="back">← Volver a Biblia + CBA</a>
  </div>
</main>
<script>
(() => {
  const ARM = "#0846a3", HAND = "#0b5ed7";
  const arm = (d, cls = "") => `<g class="${cls}"><path d="${d}" fill="none" stroke="${ARM}" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></g>`;
  const hand = (x, y) => `<circle cx="${x}" cy="${y}" r="6" fill="${HAND}"/>`;
  const MOUTH = {
    smile: '<path d="M52 76q8 8 16 0" fill="#f2641d" stroke="#0f1720" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>',
    open: '<path d="M50 74h20q0 13-10 13t-10-13z" fill="#f2641d" stroke="#0f1720" stroke-width="3.2" stroke-linejoin="round"/>',
    hmm: '<path d="M54 79q6-3 12 0" fill="none" stroke="#0f1720" stroke-width="3.2" stroke-linecap="round"/>',
    focus: '<path d="M54 78h12" stroke="#0f1720" stroke-width="3.2" stroke-linecap="round"/>'
  };
  const POSES = {
    wave: { back: arm("M26 86c-8-2-12 4-10 10") + hand(16, 96), front: `<g class="arm-wave">${arm("M94 84c8-6 10-16 6-22")}${hand(100, 60)}</g>`, mouth: "smile" },
    point: { back: arm("M26 86c-8-2-12 4-10 10") + hand(16, 96), front: `<g class="arm-point">${arm("M94 82l20 14")}${hand(116, 97)}</g>`, mouth: "smile" },
    cheer: { back: `<g class="arm-cheer-l">${arm("M28 78c-8-6-12-18-8-28")}${hand(20, 48)}</g>`, front: `<g class="arm-cheer-r">${arm("M92 78c8-6 12-18 8-28")}${hand(100, 48)}</g>` +
      '<g class="prop-star"><path d="M60 -6l5 10 11 1.6-8 7.8 1.9 11L60 19l-9.9 5.4 1.9-11-8-7.8 11-1.6z" fill="#f5b400" stroke="#d99a00" stroke-width="2" stroke-linejoin="round"/></g>', mouth: "open" },
    laptop: { back: "", front: '<g class="prop-laptop"><path d="M30 96h60l-4 22H34z" fill="#3b4652"/><rect x="34" y="90" width="52" height="8" rx="2" fill="#a7b1bc"/><path d="M24 118h72l-6 6H30z" fill="#66717d"/>' +
      '<text x="60" y="112" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-weight="800" font-size="11" fill="#6ea8fe">&lt;/&gt;</text></g>' +
      `<g class="arm-type-l">${arm("M26 88c-6 6-4 14 6 20")}${hand(34, 109)}</g><g class="arm-type-r">${arm("M94 88c6 6 4 14-6 20")}${hand(86, 109)}</g>`, mouth: "focus", look: [0, 3] },
    think: { back: arm("M26 86c-8-2-12 4-10 10") + hand(16, 96), front: `${arm("M94 88c-2 8-14 10-22 4")}${hand(70, 90)}` +
      '<g class="prop-q"><text x="108" y="26" text-anchor="middle" font-family="Manrope,system-ui,sans-serif" font-weight="800" font-size="30" fill="#7340e0">?</text></g>', mouth: "hmm", look: [2, -3] }
  };
  const buddySVG = pose => {
    const P = POSES[pose] || POSES.wave;
    return `<svg viewBox="0 0 120 132"><ellipse cx="60" cy="126" rx="30" ry="4" fill="rgb(0 0 0 / .15)"/>${P.back}` +
      '<rect x="26" y="28" width="68" height="94" rx="18" fill="#0846a3"/><rect x="26" y="24" width="68" height="92" rx="18" fill="#0b5ed7"/>' +
      '<rect x="33" y="32" width="54" height="66" rx="11" fill="#fff"/><rect x="50" y="27" width="20" height="4" rx="2" fill="#0846a3"/>' +
      '<g class="eyes"><ellipse cx="49" cy="58" rx="8" ry="10" fill="#0f1720"/><ellipse cx="71" cy="58" rx="8" ry="10" fill="#0f1720"/>' +
      `<g class="pupils" data-lx="${(P.look || [0, 0])[0]}" data-ly="${(P.look || [0, 0])[1]}" style="transform:translate(${(P.look || [0, 0])[0]}px,${(P.look || [0, 0])[1]}px)"><circle cx="51" cy="54" r="3.2" fill="#fff"/><circle cx="73" cy="54" r="3.2" fill="#fff"/></g></g>` +
      '<ellipse cx="40" cy="74" rx="5" ry="3" fill="#ff8fb3"/><ellipse cx="80" cy="74" rx="5" ry="3" fill="#ff8fb3"/>' +
      MOUTH[P.mouth] + '<circle cx="60" cy="107" r="4" fill="#4ea1ff"/>' + P.front + '</svg>';
  };
  const T = {
    es: { title: "JonatanDev · En construcción", bubble: "Programando", tag: "En construcción", h1: "Estoy preparando esta página.",
      p: "Esta página está en construcción. Mientras tanto, puedes contactarme por <strong>correo</strong> o por <strong>WhatsApp</strong> y con gusto conversamos sobre tu proyecto.",
      mail: "Correo", back: "← Volver a Biblia + CBA", wa: "Hola Jonatan, quiero consultarte por un proyecto", subj: "Consulta por un proyecto" },
    pt: { title: "JonatanDev · Em construção", bubble: "Programando", tag: "Em construção", h1: "Estou preparando esta página.",
      p: "Esta página está em construção. Enquanto isso, você pode falar comigo por <strong>e-mail</strong> ou pelo <strong>WhatsApp</strong> e conversamos com prazer sobre o seu projeto.",
      mail: "E-mail", back: "← Voltar para Bíblia + CBA", wa: "Olá Jonatan, quero falar sobre um projeto", subj: "Consulta sobre um projeto" },
    en: { title: "JonatanDev · Under construction", bubble: "Coding", tag: "Under construction", h1: "I'm working on this page.",
      p: "This page is under construction. In the meantime, you can reach me by <strong>email</strong> or <strong>WhatsApp</strong> and I'll be happy to talk about your project.",
      mail: "Email", back: "← Back to Bible Adventist", wa: "Hi Jonatan, I'd like to ask about a project", subj: "Question about a project" }
  };
  const get = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
  const set = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
  const pick = () => {
    const q = new URLSearchParams(location.search).get("lang"); if (T[q]) return q;
    const sv = get("cba-lang"); if (T[sv]) return sv;
    for (const l of (navigator.languages || [navigator.language || "es"])) { const b = String(l).slice(0, 2).toLowerCase(); if (T[b]) return b; }
    return "es";
  };
  const apply = lang => {
    const t = T[lang]; document.documentElement.lang = lang; document.title = t.title;
    document.querySelectorAll("[data-t]").forEach(el => { el.innerHTML = t[el.dataset.t]; });
    document.querySelectorAll("[data-home]").forEach(a => { a.href = "index.html?lang=" + lang; });
    document.querySelector("[data-wa]").href = "https://wa.me/5493874523935?text=" + encodeURIComponent(t.wa);
    document.querySelector("[data-mail]").href = "mailto:adventistgo@gmail.com?subject=" + encodeURIComponent(t.subj);
    document.querySelectorAll("[data-lang]").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === lang));
  };
  apply(pick());
  document.querySelectorAll("[data-lang]").forEach(b => b.addEventListener("click", () => { set("cba-lang", b.dataset.lang); apply(b.dataset.lang); }));
  document.querySelectorAll("[data-buddy]").forEach(b => { b.innerHTML = buddySVG(b.dataset.buddy); });
})();
</script>
<script>
/* Eventos para GoatCounter: clics en WhatsApp y correo */
(() => {
  const ev = (path, title) => { try { window.goatcounter && goatcounter.count({ path, title, event: true }); } catch (e) {} };
  document.addEventListener("click", e => {
    const a = e.target.closest("a"); if (!a) return;
    const h = a.href || "";
    if (/wa\.me/.test(h)) ev("servicios-whatsapp", "Clic en WhatsApp (servicios)");
    else if (/^mailto:/.test(h)) ev("servicios-correo", "Clic en correo (servicios)");
  });
})();
</script>
</body>
